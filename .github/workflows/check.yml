name: Check site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          for file in dist/*.js scripts/*.mjs; do node --check "$file"; done
      - name: Check model buffers and geometry
        run: node scripts/check-models.mjs
      - name: Check product loading and picking
        run: node scripts/check-product-loader.mjs
      - name: Check printer motion
        run: node scripts/check-printer.mjs
      - name: Check Python syntax
        run: python3 -m py_compile scripts/serve.py scripts/prepare-models.py scripts/prepare-table.py
